<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Dashboard — ThinkMaps</title>
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<link rel="icon" type="image/png" sizes="16x16" href="image/favicon-16x16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="image/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="image/favicon-192x192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="image/apple-touch-icon.png" />
<link rel="manifest" href="image/site.webmanifest" />
<meta name="theme-color" content="#D97757" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=6">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
<header class="site">
  <nav class="bar">
    <a href="index.html" class="logo">
      <svg class="logo-mark" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <circle cx="9" cy="3" r="2" fill="#D97757"/>
        <circle cx="3" cy="14" r="2" fill="#1F1B16"/>
        <circle cx="15" cy="14" r="2" fill="#1F1B16"/>
        <path d="M9 5L3 12M9 5L15 12" stroke="#D97757" stroke-width="1.2"/>
      </svg>
      ThinkMaps
    </a>
    <div class="nav-cta">
      <a href="settings.html" class="user-icon-btn" id="userIconBtn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="19" height="19">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
        </svg>
      </a>
    </div>
  </nav>
</header>
<main class="dashboard-main" id="dashboardRoot">
  <div class="wrap">
    <h1 id="dashboardGreeting">Loading your dashboard…</h1>
    <div class="pro-banner" id="dashboardBanner"></div>
    <div id="blueprintArea">
      <p class="muted">Loading your blueprint…</p>
    </div>
  </div>
</main>
<!-- Shown before any blueprint is created — the person names it up front
     instead of getting an "Untitled Blueprint" to rename later. -->
<div class="modal-overlay" id="newBlueprintModal" style="display:none;">
  <div class="modal-card">
    <h3>Name your blueprint</h3>
    <p class="muted">Give it something memorable — you can always rename it later.</p>
    <input type="text" id="newBlueprintNameInput" placeholder="e.g. Fitness app idea" maxlength="80" autofocus />
    <p class="auth-error" id="newBlueprintError"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelNewBlueprintBtn" type="button">Cancel</button>
      <button class="btn btn-primary" id="confirmNewBlueprintBtn" type="button">Create blueprint</button>
    </div>
  </div>
</div>
<script src="script.js?v=6"></script>
<script src="feedback.js?v=4"></script>
</body>
</html>
