<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ThinkMaps — Blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/canvas.css">
</head>
<body>
  <div class="topbar">
    <div class="brand"><a href="dashboard.html" style="text-decoration:none;color:inherit;">← ThinkMaps</a></div>
    <div style="display:flex;align-items:center;gap:12px;">
      <span class="lock-badge" id="lockBadge" hidden>Read-only — Free plan</span>
      <button class="btn btn-ghost" id="stuckBtn">I'm stuck — pick for me</button>
    </div>
  </div>

  <div class="viewport" id="viewport">
    <div class="world" id="world">
      <svg class="edges-layer" id="edgesLayer" width="8000" height="8000"></svg>
      <div class="groups-layer" id="groupsLayer"></div>
    </div>
  </div>

  <div class="zoom-controls">
    <button id="zoomOut" title="Zoom out">−</button>
    <button id="zoomReset" title="Reset view">⤾</button>
    <button id="zoomIn" title="Zoom in">+</button>
  </div>

  <div class="popover" id="popover" hidden></div>
  <div class="toast" id="toast"></div>

  <script type="module" src="js/canvas-engine.js"></script>
</body>
</html>
