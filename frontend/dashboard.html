<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ThinkMaps — Your blueprints</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<style>
  main{ max-width:760px; margin:0 auto; padding:48px 24px; }
  h1{ font-family:var(--font-display); font-size:30px; margin:0 0 6px; }
  .sub{ color:var(--ink-muted); margin:0 0 32px; }
  .list{ display:flex; flex-direction:column; gap:12px; }
  .row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:18px 20px; text-decoration:none;
  }
  .row:hover{ border-color:var(--accent); }
  .row h3{ font-family:var(--font-body); font-size:16px; margin:0 0 4px; color:var(--ink); }
  .row .meta{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-muted); }
  .badge{
    font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase;
    letter-spacing:.06em; padding:4px 9px; border-radius:999px;
  }
  .badge.open{ background:var(--accent-soft); color:var(--accent-deep); }
  .badge.locked{ background:var(--frozen-bg); color:var(--frozen); }
  .empty{ text-align:center; padding:60px 0; color:var(--ink-muted); }
  .userline{ display:flex; align-items:center; gap:14px; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">ThinkMaps</div>
    <div class="userline">
      <span id="userEmail" style="font-size:13px;color:var(--ink-muted);"></span>
      <button class="btn btn-ghost" id="signOutBtn">Sign out</button>
    </div>
  </div>
  <main>
    <h1>Your blueprints</h1>
    <p class="sub">Free plan: each blueprint stays editable for 7 days, then it's read-only until you upgrade.</p>
    <button class="btn btn-primary" id="newBtn" style="margin-bottom:24px;">+ New blueprint</button>
    <div class="list" id="list"></div>
  </main>
  <div class="toast" id="toast"></div>

  <script type="module">
    import { supabase } from './js/supabaseClient.js';
    import { api } from './js/api.js';

    const toast = document.getElementById('toast');
    function showToast(message, isError = false) {
      toast.textContent = message;
      toast.classList.toggle('error', isError);
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3200);
    }

    const { data: sessionData } = await supabase.auth.getSession();
    if (!sessionData?.session) {
      window.location.href = 'auth.html';
    } else {
      document.getElementById('userEmail').textContent = sessionData.session.user.email;
    }

    document.getElementById('signOutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = 'auth.html';
    });

    function daysLeft(createdAt) {
      const ageMs = Date.now() - new Date(createdAt).getTime();
      return 7 - Math.floor(ageMs / (24 * 60 * 60 * 1000));
    }

    async function loadBlueprints() {
      const list = document.getElementById('list');
      list.innerHTML = '<p class="empty">Loading…</p>';
      try {
        const { blueprints } = await api.listBlueprints();
        if (!blueprints.length) {
          list.innerHTML = '<p class="empty">No blueprints yet — start one above and watch the graph branch out.</p>';
          return;
        }
        list.innerHTML = '';
        blueprints.forEach((bp) => {
          const left = daysLeft(bp.created_at);
          const locked = left <= 0; // client-side hint only — the API enforces the real check
          const a = document.createElement('a');
          a.className = 'row';
          a.href = `canvas.html?id=${bp.id}`;
          a.innerHTML = `
            <div>
              <h3>${bp.title}</h3>
              <div class="meta">Created ${new Date(bp.created_at).toLocaleDateString()}</div>
            </div>
            <span class="badge ${locked ? 'locked' : 'open'}">${locked ? 'Read-only' : `${left}d left`}</span>
          `;
          list.appendChild(a);
        });
      } catch (err) {
        list.innerHTML = '';
        showToast(err.message || 'Could not load blueprints', true);
      }
    }

    document.getElementById('newBtn').addEventListener('click', async () => {
      const title = prompt('Name this blueprint (e.g. "Fitness app for shift workers")', 'Untitled blueprint');
      if (title === null) return;
      try {
        const { blueprint } = await api.createBlueprint(title);
        window.location.href = `canvas.html?id=${blueprint.id}`;
      } catch (err) {
        showToast(err.message || 'Could not create blueprint', true);
      }
    });

    loadBlueprints();
  </script>
</body>
</html>
