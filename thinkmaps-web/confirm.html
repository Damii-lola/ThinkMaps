<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Harden Your Idea — ThinkMaps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
<header class="site">
  <nav class="bar">
    <a href="dashboard.html" class="logo">
      <svg class="logo-mark" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <circle cx="9" cy="3" r="2" fill="#D97757"/>
        <circle cx="3" cy="14" r="2" fill="#1F1B16"/>
        <circle cx="15" cy="14" r="2" fill="#1F1B16"/>
        <path d="M9 5L3 12M9 5L15 12" stroke="#D97757" stroke-width="1.2"/>
      </svg>
      ThinkMaps
    </a>
  </nav>
</header>

<main class="ideate-main" id="confirmRoot">
  <div class="wrap ideate-wrap">
    <div class="ideate-meta">
      <span class="eyebrow">Hardening your idea</span>
      <span class="ideate-progress" id="confirmProgress"></span>
    </div>
    <div class="ideate-progress-track"><div class="ideate-progress-fill" id="confirmProgressFill"></div></div>

    <div class="ideate-card" id="confirmCard">
      <h2 class="ideate-question" id="confirmQuestion">Loading your first confirmation…</h2>
      <div class="ideate-options" id="confirmOptions"></div>
    </div>

    <!-- Shown only while the 3rd answer is being processed — competitive
         research + pros/cons + solutions genuinely takes longer than a
         single question turnaround, so this gets its own honest state
         instead of looking frozen. -->
    <div class="confirm-researching" id="confirmResearching" style="display:none;">
      <div class="confirm-spinner"></div>
      <h3>Researching the competitive landscape…</h3>
      <p class="muted">Looking at similar products, pulling out what works, and working out how this idea solves what doesn't.</p>
    </div>

    <div class="confirm-result" id="confirmResult" style="display:none;"></div>
  </div>
</main>

<script src="script.js?v=2"></script>
<script src="feedback.js"></script>
</body>
</html>
