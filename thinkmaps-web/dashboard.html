<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — ThinkMaps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<header class="site">
  <nav class="bar">
    <a href="index.html" class="logo">
      <svg class="logo-mark" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <circle cx="9" cy="3" r="2" fill="#D97757"/>
        <circle cx="3" cy="14" r="2" fill="#1F1B16"/>
        <circle cx="15" cy="14" r="2" fill="#1F1B16"/>
        <path d="M9 5L3 12M9 5L15 12" stroke="#D97757" stroke-width="1.2"/>
      </svg>
      ThinkMaps
    </a>
    <div class="nav-cta">
      <button class="btn btn-ghost" id="logoutBtn" type="button">Log out</button>
    </div>
  </nav>
</header>

<main class="dashboard-main" id="dashboardRoot">
  <div class="wrap">
    <h1 id="dashboardGreeting">Loading your dashboard…</h1>

    <div class="pro-banner" id="dashboardBanner"></div>

    <div id="blueprintArea">
      <p class="muted">Loading your blueprint…</p>
    </div>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
