        <circle cx="9" cy="3" r="2" fill="#D97757"/>

<main class="ideate-main" id="ideateRoot">

      <h2 class="ideate-question" id="ideateQuestion">Loading your first question…</h2>
      <div class="ideate-options" id="ideateOptions"></div>
    </div>
    <div class="ideate-result" id="ideateResult" style="display:none;"></div>
  </div>
</main>
