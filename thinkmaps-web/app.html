<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blueprint — ThinkMaps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
<header class="site app-header">
  <nav class="bar">
    <a href="dashboard.html" class="logo">
      <svg class="logo-mark" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <circle cx="9" cy="3" r="2" fill="#D97757"/>
        <circle cx="3" cy="14" r="2" fill="#1F1B16"/>
        <circle cx="15" cy="14" r="2" fill="#1F1B16"/>
        <path d="M9 5L3 12M9 5L15 12" stroke="#D97757" stroke-width="1.2"/>
      </svg>
      ThinkMaps
    </a>
    <span class="app-blueprint-title" id="blueprintTitle">Loading…</span>
    <div class="nav-cta">
      <button class="btn btn-primary" id="generateIdeasBtn" type="button">Generate Ideas</button>
    </div>
  </nav>
  <div class="locked-banner" id="lockedBanner" style="display:none;">
    This blueprint is read-only on the free tier. <a href="index.html#pricing">Upgrade to Pro</a> to keep building it.
  </div>
</header>
<main class="canvas-viewport" id="canvasViewport">
  <div class="canvas-world" id="canvasWorld">
    <div id="linesLayer"></div>
    <div id="groupsLayer"></div>
  </div>
  <div class="canvas-controls">
    <button class="zoom-btn" id="fullscreenBtn" type="button" title="Fullscreen">⛶</button>
    <button class="zoom-btn" id="zoomInBtn" type="button" title="Zoom in">+</button>
    <button class="zoom-btn" id="zoomOutBtn" type="button" title="Zoom out">−</button>
    <button class="zoom-btn" id="zoomResetBtn" type="button" title="Reset view">⟲</button>
  </div>
  <p class="canvas-empty-message" id="canvasLoadingMsg">Loading your blueprint…</p>
  <div class="canvas-busy-indicator" id="canvasBusyIndicator" style="display:none;">Thinking…</div>
</main>
<script src="script.js"></script>
</body>
</html>
