<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blueprint — ThinkMaps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="nav"></div>

<div class="canvas-shell" id="canvasShell" style="height:calc(100vh - 65px);">
  <div class="path-banner" id="lockedBanner" style="display:none;"></div>
  <div class="path-banner" id="errorBanner" style="display:none;"></div>

  <div class="canvas-world" id="canvasWorld">
    <svg class="canvas-lines" id="canvasLines" width="6000" height="4000"></svg>
    <!-- node group cards get injected here by render() -->
  </div>

  <div class="zoom-controls">
    <button class="icon-btn" id="zoomOutBtn">−</button>
    <button class="icon-btn" id="zoomResetBtn">⤾</button>
    <button class="icon-btn" id="zoomInBtn">+</button>
  </div>

  <button class="btn btn-primary generate-btn-floating" id="generateBtn">✦ Generate ideas from this path</button>
  <div class="generating-toast" id="generatingToast" style="display:none;">Branching…</div>
</div>

<div id="ideaOverlay"></div>

<script type="module">
import { supabase, apiFetch, requireAuth, getProfile, renderNavBar, isBlueprintLocked, escapeHtml } from './shared.js';

(async () => {
  const user = await requireAuth();
  if (!user) return; // requireAuth already redirected to auth.html

  const params = new URLSearchParams(window.location.search);
  const blueprintId = params.get('id');
  if (!blueprintId) { window.location.href = 'dashboard.html'; return; }

  const profile = await getProfile(user.id);

  let blueprint = null;
  let graph = null;
  let framework = [];
  let ideas = null;
  let isLocked = false;

  const transform = { x: 0, y: 0, scale: 1 };
  const drag = { mode: null };
  const CARD_WIDTH = 240, HEADER_HEIGHT = 44, ROW_HEIGHT = 40;

  const worldEl = document.getElementById('canvasWorld');
  const linesEl = document.getElementById('canvasLines');
  const shellEl = document.getElementById('canvasShell');

  // ---- nav ----
  const backLink = document.createElement('a');
  backLink.href = 'dashboard.html';
  backLink.className = 'btn btn-ghost';
  backLink.textContent = '← Dashboard';
  renderNavBar(document.getElementById('nav'), backLink);

  // ---- pure graph helpers ----
  function optionAnchor(node, optionId) {
    const index = node.options.findIndex((o) => o.id === optionId);
    return { x: node.x + CARD_WIDTH, y: node.y + HEADER_HEIGHT + index * ROW_HEIGHT + ROW_HEIGHT / 2 };
  }
  function headerAnchor(node) {
    return { x: node.x, y: node.y + HEADER_HEIGHT / 2 };
  }
  function pathToNode(nodeId) {
    const chain = [];
    let current = graph.nodesById[nodeId];
    while (current) {
      if (current.selectedOptionId) {
        const opt = current.options.find((o) => o.id === current.selectedOptionId);
        if (opt) chain.unshift({ label: current.label, choice: opt.text });
      }
      current = current.parentRef ? graph.nodesById[current.parentRef.nodeId] : null;
    }
    return chain;
  }
  function ancestorPath(nodeId) {
    const node = graph.nodesById[nodeId];
    if (!node || !node.parentRef) return [];
    return pathToNode(node.parentRef.nodeId);
  }
  function deriveActivePath() {
    const path = [];
    function walk(nodeId) {
      const node = graph.nodesById[nodeId];
      if (!node) return;
      if (node.selectedOptionId) {
        const opt = node.options.find((o) => o.id === node.selectedOptionId);
        if (opt) path.push({ label: node.label, choice: opt.text });
        (node.children[node.selectedOptionId] || []).forEach(walk);
      }
    }
    walk(graph.rootId);
    return path;
  }
  function computeActiveNodeIds() {
    const active = new Set();
    function walk(nodeId) {
      active.add(nodeId);
      const node = graph.nodesById[nodeId];
      if (!node || !node.selectedOptionId) return;
      (node.children[node.selectedOptionId] || []).forEach(walk);
    }
    walk(graph.rootId);
    return active;
  }
  function buildLines() {
    const lines = [];
    Object.values(graph.nodesById).forEach((node) => {
      const toDraw = [
        ...(node.selectedOptionId ? [{ id: node.selectedOptionId, frozen: false }] : []),
        ...node.frozenOptionIds.map((id) => ({ id, frozen: true }))
      ];
      toDraw.forEach(({ id, frozen }) => {
        const childIds = node.children[id] || [];
        const start = optionAnchor(node, id);
        childIds.forEach((childId) => {
          const child = graph.nodesById[childId];
          if (!child) return;
          lines.push({ start, end: headerAnchor(child), frozen });
        });
      });
    });
    return lines;
  }

  // ---- load + save ----
  function showError(msg) {
    const el = document.getElementById('errorBanner');
    el.textContent = msg;
    el.style.display = 'block';
  }

  async function loadBlueprint() {
    const { data, error } = await supabase.from('blueprints').select('*').eq('id', blueprintId).single();
    if (error || !data) {
      showError('Could not load this blueprint.');
      return false;
    }
    blueprint = data;
    graph = data.graph_data;
    if (data.ideas) ideas = data.ideas;
    isLocked = isBlueprintLocked(blueprint, profile);
    return true;
  }

  let saveTimer = null;
  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      supabase.from('blueprints').update({ graph_data: graph, updated_at: new Date().toISOString() }).eq('id', blueprintId);
    }, 800);
  }

  // ---- rendering ----
  function applyTransform() {
    worldEl.style.transform = `translate(${transform.x}px, ${transform.y}px) scale(${transform.scale})`;
  }

  function render() {
    const lockedBanner = document.getElementById('lockedBanner');
    if (isLocked) {
      lockedBanner.innerHTML = 'This blueprint is read-only. <a href="pricing.html">Upgrade to Pro</a> to keep building.';
      lockedBanner.style.display = 'block';
    } else {
      lockedBanner.style.display = 'none';
    }
    document.getElementById('generateBtn').style.display = isLocked ? 'none' : 'inline-flex';

    Array.from(worldEl.querySelectorAll('.node-group-card')).forEach((el) => el.remove());

    const activeIds = computeActiveNodeIds();
    Object.values(graph.nodesById).forEach((node) => {
      worldEl.appendChild(renderNodeCard(node, !activeIds.has(node.id)));
    });

    linesEl.innerHTML = '';
    buildLines().forEach((line) => {
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute(
        'd',
        `M ${line.start.x} ${line.start.y} C ${line.start.x + 80} ${line.start.y}, ${line.end.x - 80} ${line.end.y}, ${line.end.x} ${line.end.y}`
      );
      path.setAttribute('class', line.frozen ? 'line-frozen' : 'line-active');
      linesEl.appendChild(path);
    });

    applyTransform();
  }

  function renderNodeCard(node, isFrozen) {
    const card = document.createElement('div');
    card.className = `node-group-card${isFrozen ? ' frozen' : ''}`;
    card.style.left = node.x + 'px';
    card.style.top = node.y + 'px';
    card.style.width = CARD_WIDTH + 'px';

    const header = document.createElement('div');
    header.className = 'node-group-header';
    header.innerHTML = `<span class="header-dot"></span><span class="label">${escapeHtml(node.label)}</span>`;

    if (!isLocked) {
      const actions = document.createElement('div');
      actions.className = 'node-group-actions';

      const retryBtn = document.createElement('button');
      retryBtn.className = 'icon-btn';
      retryBtn.title = 'Retry — fresh options';
      retryBtn.textContent = '↻';
      retryBtn.addEventListener('click', (e) => { e.stopPropagation(); retryNode(node.id); });

      const randomBtn = document.createElement('button');
      randomBtn.className = 'icon-btn';
      randomBtn.title = 'Random pick';
      randomBtn.textContent = '✦';
      randomBtn.addEventListener('click', (e) => { e.stopPropagation(); randomNode(node.id); });

      actions.appendChild(retryBtn);
      actions.appendChild(randomBtn);
      header.appendChild(actions);
    }

    header.addEventListener('mousedown', (e) => handleHeaderMouseDown(e, node.id));
    card.appendChild(header);

    node.options.forEach((opt) => {
      const row = document.createElement('div');
      const isActive = node.selectedOptionId === opt.id;
      const isFrozenChoice = node.frozenOptionIds.includes(opt.id);
      row.className = `option-row${isActive ? ' active' : ''}${isFrozenChoice ? ' frozen-choice' : ''}`;
      row.innerHTML = `<span>${escapeHtml(opt.text)}</span><span class="option-dot"></span>`;
      row.addEventListener('click', () => { if (!isLocked) selectOption(node.id, opt.id); });
      card.appendChild(row);
    });

    if (!isLocked) {
      const customRow = document.createElement('div');
      customRow.className = 'custom-option-row';

      const addBtn = document.createElement('button');
      addBtn.className = 'icon-btn';
      addBtn.textContent = '+ Custom';
      addBtn.addEventListener('click', () => {
        customRow.innerHTML = '';
        const input = document.createElement('input');
        input.placeholder = 'Your own option…';
        const confirmBtn = document.createElement('button');
        confirmBtn.className = 'icon-btn';
        confirmBtn.textContent = '✓';
        const submit = () => {
          const text = input.value.trim();
          if (text) addCustomOption(node.id, text);
        };
        confirmBtn.addEventListener('click', submit);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
        customRow.appendChild(input);
        customRow.appendChild(confirmBtn);
        input.focus();
      });

      customRow.appendChild(addBtn);
      card.appendChild(customRow);
    }

    return card;
  }

  // ---- pan / zoom / drag ----
  shellEl.addEventListener('mousedown', (e) => {
    if (e.target.closest('.node-group-card')) return;
    drag.mode = 'pan';
    drag.startX = e.clientX; drag.startY = e.clientY;
    drag.originX = transform.x; drag.originY = transform.y;
  });

  function handleHeaderMouseDown(e, nodeId) {
    e.stopPropagation();
    if (isLocked) return;
    const node = graph.nodesById[nodeId];
    drag.mode = 'node'; drag.nodeId = nodeId;
    drag.startX = e.clientX; drag.startY = e.clientY;
    drag.originX = node.x; drag.originY = node.y;
  }

  window.addEventListener('mousemove', (e) => {
    if (!drag.mode) return;
    const dx = e.clientX - drag.startX;
    const dy = e.clientY - drag.startY;

    if (drag.mode === 'pan') {
      transform.x = drag.originX + dx;
      transform.y = drag.originY + dy;
      applyTransform();
    } else if (drag.mode === 'node') {
      const node = graph.nodesById[drag.nodeId];
      if (!node) return;
      node.x = drag.originX + dx / transform.scale;
      node.y = drag.originY + dy / transform.scale;
      render();
    }
  });

  window.addEventListener('mouseup', () => {
    if (drag.mode === 'node') scheduleSave();
    drag.mode = null;
  });

  shellEl.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoomBy(-e.deltaY * 0.001);
  }, { passive: false });

  function zoomBy(delta) {
    transform.scale = Math.min(2, Math.max(0.3, transform.scale + delta));
    applyTransform();
  }
  document.getElementById('zoomInBtn').addEventListener('click', () => zoomBy(0.15));
  document.getElementById('zoomOutBtn').addEventListener('click', () => zoomBy(-0.15));
  document.getElementById('zoomResetBtn').addEventListener('click', () => {
    transform.x = 0; transform.y = 0; transform.scale = 1;
    applyTransform();
  });

  // ---- mutations (talk to the Render backend for anything AI-generated) ----
  async function generateChildrenFor(nodeId, optionId, pathContext) {
    document.getElementById('generatingToast').style.display = 'block';
    try {
      const { groups } = await apiFetch('/api/generate-nodes', { method: 'POST', body: JSON.stringify({ pathContext }) });
      const parentNode = graph.nodesById[nodeId];
      const anchor = optionAnchor(parentNode, optionId);
      const newChildIds = [];

      groups.forEach((g, i) => {
        const newId = `node-${Date.now()}-${i}-${Math.random().toString(36).slice(2, 7)}`;
        graph.nodesById[newId] = {
          id: newId,
          label: g.label || 'Group',
          options: (g.options || []).slice(0, 6).map((text, j) => ({ id: `${newId}-opt-${j}`, text })),
          selectedOptionId: null,
          frozenOptionIds: [],
          children: {},
          parentRef: { nodeId, optionId },
          x: parentNode.x + 280,
          y: anchor.y - ((groups.length - 1) * 70) / 2 + i * 70
        };
        newChildIds.push(newId);
      });

      parentNode.children[optionId] = newChildIds;
      render();
      scheduleSave();
    } catch (err) {
      showError(err.message);
    } finally {
      document.getElementById('generatingToast').style.display = 'none';
    }
  }

  async function selectOption(nodeId, optionId) {
    if (isLocked) return;
    const node = graph.nodesById[nodeId];
    if (!node || node.selectedOptionId === optionId) return;

    const chosenText = node.options.find((o) => o.id === optionId)?.text || '';
    const pathContext = [...ancestorPath(nodeId), { label: node.label, choice: chosenText }];
    const alreadyExplored = (node.children[optionId] || []).length > 0;

    if (node.selectedOptionId) {
      node.frozenOptionIds = Array.from(new Set([...node.frozenOptionIds, node.selectedOptionId]));
    }
    node.frozenOptionIds = node.frozenOptionIds.filter((id) => id !== optionId);
    node.selectedOptionId = optionId;
    render();
    scheduleSave();

    if (!alreadyExplored) await generateChildrenFor(nodeId, optionId, pathContext);
  }

  async function retryNode(nodeId) {
    if (isLocked) return;
    const pathContext = ancestorPath(nodeId);
    document.getElementById('generatingToast').style.display = 'block';
    try {
      const { groups } = await apiFetch('/api/generate-nodes', { method: 'POST', body: JSON.stringify({ pathContext }) });
      const fresh = groups[0];
      if (!fresh) return;
      const node = graph.nodesById[nodeId];
      node.label = fresh.label || node.label;
      node.options = (fresh.options || []).slice(0, 6).map((text, j) => ({ id: `${nodeId}-opt-${Date.now()}-${j}`, text }));
      node.selectedOptionId = null;
      node.frozenOptionIds = [];
      node.children = {};
      render();
      scheduleSave();
    } catch (err) {
      showError(err.message);
    } finally {
      document.getElementById('generatingToast').style.display = 'none';
    }
  }

  function randomNode(nodeId) {
    if (isLocked) return;
    const node = graph.nodesById[nodeId];
    if (!node.options.length) return;
    const pick = node.options[Math.floor(Math.random() * node.options.length)];
    selectOption(nodeId, pick.id);
  }

  function addCustomOption(nodeId, text) {
    if (isLocked) return;
    const node = graph.nodesById[nodeId];
    if (node.options.length >= 6) return;
    node.options.push({ id: `${nodeId}-custom-${Date.now()}`, text });
    render();
    scheduleSave();
  }

  document.getElementById('generateBtn').addEventListener('click', async () => {
    const pathContext = deriveActivePath();
    if (pathContext.length === 0) {
      showError('Pick at least one option on the graph before generating ideas.');
      return;
    }
    const btn = document.getElementById('generateBtn');
    btn.disabled = true;
    btn.textContent = 'Researching live…';
    try {
      const { ideas: newIdeas } = await apiFetch('/api/generate-ideas', { method: 'POST', body: JSON.stringify({ pathContext }) });
      ideas = newIdeas;
      supabase.from('blueprints').update({ ideas: newIdeas }).eq('id', blueprintId);
      renderIdeaOverlay();
    } catch (err) {
      showError(err.message || 'Could not generate ideas right now.');
    } finally {
      btn.disabled = false;
      btn.textContent = '✦ Generate ideas from this path';
    }
  });

  // ---- idea results overlay + radar chart ----
  function polarPoint(cx, cy, angleDeg, radius) {
    const rad = (angleDeg * Math.PI) / 180;
    return { x: cx + radius * Math.cos(rad), y: cy + radius * Math.sin(rad) };
  }
  function average(arr) {
    if (!arr || !arr.length) return 0;
    return arr.reduce((a, b) => a + b, 0) / arr.length;
  }
  function toPath(points) {
    return points.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  }

  function renderIdeaOverlay() {
    const root = document.getElementById('ideaOverlay');
    if (!ideas || ideas.length === 0) { root.innerHTML = ''; return; }

    let activeIndex = 0;
    let openCategory = null;

    function renderValidationKit(vk) {
      let html = '<div class="idea-block"><div class="lbl">Validation kit</div>';
      if ((vk.surveyQuestions || []).length) {
        html += `<p class="muted sub-lbl">Survey questions</p><ul class="muted">${vk.surveyQuestions.map((q) => `<li>${escapeHtml(q)}</li>`).join('')}</ul>`;
      }
      if ((vk.interviewScript || []).length) {
        html += `<p class="muted sub-lbl">Interview script</p><ul class="muted">${vk.interviewScript.map((q) => `<li>${escapeHtml(q)}</li>`).join('')}</ul>`;
      }
      if (vk.landingPageCopy) {
        html += `<p class="muted sub-lbl">Landing page copy</p><p class="muted">${escapeHtml(vk.landingPageCopy)}</p>`;
      }
      if (vk.fakeDoorTestGuidance) {
        html += `<p class="muted sub-lbl">Fake-door test</p><p class="muted">${escapeHtml(vk.fakeDoorTestGuidance)}</p>`;
      }
      html += '</div>';
      return html;
    }

    function draw() {
      const idea = ideas[activeIndex];
      root.innerHTML = `
        <div class="idea-results-overlay">
          <div class="idea-results-head"><h2>Your ideas</h2><button class="icon-btn" id="closeIdeas">✕</button></div>
          <div class="idea-tabs" id="ideaTabs"></div>
          <div class="idea-card">
            <h3>${escapeHtml(idea.name || '')}</h3>
            <p class="idea-oneliner">${escapeHtml(idea.oneLiner || '')}</p>
            <div class="idea-block"><div class="lbl">Core problem</div><p class="muted">${escapeHtml(idea.problem || '')}</p></div>
            ${
              (idea.sourcedQuotes || []).length
                ? `<div class="idea-block"><div class="lbl">What people are actually saying</div>${idea.sourcedQuotes
                    .map((q) => `<p class="muted quote-line">"${escapeHtml(q.quote)}" ${q.sourceRef ? `<span class="src-ref">[${escapeHtml(String(q.sourceRef))}]</span>` : ''}</p>`)
                    .join('')}</div>`
                : ''
            }
            <div class="idea-block"><div class="lbl">Existing solutions fall short because</div><p class="muted">${escapeHtml(idea.existingSolutionsWeaknesses || '')}</p></div>
            <div class="idea-block"><div class="lbl">The 10x upgrade</div><p class="muted">${escapeHtml(idea.tenXUpgrade || '')}</p></div>
            <div class="idea-block"><div class="lbl">Monetization</div><p class="muted">${escapeHtml(idea.monetization || '')}</p></div>
            <div class="idea-block"><div class="lbl">Scoped MVP</div><p class="muted">${escapeHtml(idea.mvp || '')}</p>${idea.riskyCoreMechanic ? `<p class="muted"><b>Riskiest part:</b> ${escapeHtml(idea.riskyCoreMechanic)}</p>` : ''}</div>
            ${idea.validationKit ? renderValidationKit(idea.validationKit) : ''}
            ${(idea.nextSteps || []).length ? `<div class="idea-block"><div class="lbl">Next steps</div><ul class="muted">${idea.nextSteps.map((s) => `<li>${escapeHtml(s)}</li>`).join('')}</ul></div>` : ''}
            ${idea.buildPrompt ? `<div class="idea-block"><div class="lbl">Build prompt (Cursor / Lovable)</div><pre class="build-prompt">${escapeHtml(idea.buildPrompt)}</pre></div>` : ''}
          </div>
          <div id="radarPanel"></div>
        </div>
      `;

      const tabsEl = document.getElementById('ideaTabs');
      ideas.forEach((it, i) => {
        const tab = document.createElement('button');
        tab.className = `idea-tab${i === activeIndex ? ' active' : ''}`;
        tab.textContent = it.name || `Idea ${i + 1}`;
        tab.addEventListener('click', () => { activeIndex = i; openCategory = null; draw(); });
        tabsEl.appendChild(tab);
      });

      document.getElementById('closeIdeas').addEventListener('click', () => { root.innerHTML = ''; });
      renderRadar(idea.scores);
    }

    function renderRadar(scores) {
      const panel = document.getElementById('radarPanel');
      const categoryNames = framework.map((c) => c.name);
      const categoryAverages = categoryNames.map((name) => average(scores?.[name]));
      const n = categoryAverages.length || 1;
      const step = 360 / n;
      const cx = 120, cy = 120, maxR = 92;
      const valuePoints = categoryAverages.map((s, i) => polarPoint(cx, cy, -90 + i * step, (s / 10) * maxR));
      const axisEnds = categoryAverages.map((_, i) => polarPoint(cx, cy, -90 + i * step, maxR));
      const ring = (f) => categoryAverages.map((_, i) => polarPoint(cx, cy, -90 + i * step, maxR * f));

      panel.innerHTML = `
        <div class="radar-panel">
          <h4>Scored against the 100-question framework</h4>
          <svg viewBox="0 0 240 240" aria-hidden="true">
            <polygon points="${toPath(ring(1))}" fill="none" stroke="#DAD5C7" />
            <polygon points="${toPath(ring(0.66))}" fill="none" stroke="#DAD5C7" />
            <polygon points="${toPath(ring(0.33))}" fill="none" stroke="#DAD5C7" />
            ${axisEnds.map((p) => `<line x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}" stroke="#DAD5C7" />`).join('')}
            <polygon points="${toPath(valuePoints)}" fill="#D97757" fill-opacity="0.22" stroke="#D97757" stroke-width="2" />
          </svg>
          <div class="radar-legend" id="radarLegend"></div>
          <div id="categoryDetail"></div>
        </div>
      `;

      const legend = document.getElementById('radarLegend');
      categoryNames.forEach((name, i) => {
        const btn = document.createElement('button');
        btn.className = 'category-toggle';
        btn.innerHTML = `<span>${escapeHtml(name)}</span><b>${categoryAverages[i].toFixed(1)}</b>`;
        btn.addEventListener('click', () => {
          openCategory = openCategory === name ? null : name;
          renderDetail(scores);
        });
        legend.appendChild(btn);
      });
      renderDetail(scores);
    }

    function renderDetail(scores) {
      const detailEl = document.getElementById('categoryDetail');
      if (!openCategory) { detailEl.innerHTML = ''; return; }
      const cat = framework.find((c) => c.name === openCategory);
      if (!cat) { detailEl.innerHTML = ''; return; }
      detailEl.innerHTML = `
        <div class="category-detail">
          <div class="lbl">${escapeHtml(openCategory)}</div>
          <ul>${cat.questions.map((q, i) => `<li><span>${escapeHtml(q)}</span><b>${scores?.[openCategory]?.[i] ?? '—'}</b></li>`).join('')}</ul>
        </div>
      `;
    }

    draw();
  }

  // ---- boot ----
  apiFetch('/api/framework').then((res) => { framework = res.framework || []; }).catch(() => {});

  const ok = await loadBlueprint();
  if (ok) {
    render();
    if (ideas) renderIdeaOverlay();
  }
})();
</script>

</body>
</html>
