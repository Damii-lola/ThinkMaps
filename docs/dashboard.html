<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your blueprints — ThinkMaps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="nav"></div>

<div class="dashboard-shell">
  <div class="dashboard-head">
    <h1>Your blueprints</h1>
    <button class="btn btn-primary" id="newBtn">+ New blueprint</button>
  </div>

  <div class="limit-banner" id="limitBanner" style="display:none;">
    <span>Free tier is one blueprint. Upgrade to Pro for unlimited maps.</span>
    <a href="pricing.html" class="btn btn-primary">Go Pro</a>
  </div>

  <div class="auth-error" id="errorBox" style="display:none;"></div>

  <div id="blueprintList"><div class="page-loading">Loading…</div></div>
</div>

<script type="module">
  import { supabase, apiFetch, requireAuth, getProfile, renderNavBar, isBlueprintLocked } from './shared.js';

  const user = await requireAuth();
  if (!user) {
    // requireAuth already redirected to auth.html
  } else {
    const profile = await getProfile(user.id);

    const signOutBtn = document.createElement('button');
    signOutBtn.className = 'btn btn-ghost';
    signOutBtn.textContent = 'Sign out';
    signOutBtn.onclick = async () => {
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    };
    renderNavBar(document.getElementById('nav'), signOutBtn);

    let blueprints = [];

    function renderList() {
      const atLimit = !profile?.is_pro && blueprints.length >= 1;
      document.getElementById('limitBanner').style.display = atLimit ? 'flex' : 'none';
      document.getElementById('newBtn').disabled = atLimit;

      const listEl = document.getElementById('blueprintList');

      if (blueprints.length === 0) {
        listEl.innerHTML = '<div class="empty-state"><p>No blueprints yet. Start one and watch the graph branch.</p></div>';
        return;
      }

      const grid = document.createElement('div');
      grid.className = 'blueprint-grid';

      blueprints.forEach((bp) => {
        const locked = isBlueprintLocked(bp, profile);
        const card = document.createElement('a');
        card.href = `canvas.html?id=${bp.id}`;
        card.className = 'blueprint-card';
        card.innerHTML = `
          <h3>${bp.title || 'Untitled blueprint'}</h3>
          <div class="meta">Created ${new Date(bp.created_at).toLocaleDateString()}</div>
          ${locked ? '<span class="locked-tag">Read-only — Pro to keep building</span>' : ''}
        `;
        grid.appendChild(card);
      });

      listEl.innerHTML = '';
      listEl.appendChild(grid);
    }

    async function loadBlueprints() {
      const { data } = await supabase
        .from('blueprints')
        .select('id, title, created_at, updated_at')
        .order('created_at', { ascending: false });
      blueprints = data || [];
      renderList();
    }

    document.getElementById('newBtn').addEventListener('click', async () => {
      const atLimit = !profile?.is_pro && blueprints.length >= 1;
      if (atLimit) return;

      const btn = document.getElementById('newBtn');
      btn.disabled = true;
      btn.textContent = 'Setting up…';
      document.getElementById('errorBox').style.display = 'none';

      try {
        const { groups } = await apiFetch('/api/generate-nodes', {
          method: 'POST',
          body: JSON.stringify({ pathContext: [] })
        });

        const rootGroup = groups[0] || { label: 'Niches', options: [] };
        const rootId = 'root';
        const graph_data = {
          rootId,
          nodesById: {
            [rootId]: {
              id: rootId,
              label: rootGroup.label,
              options: rootGroup.options.map((text, i) => ({ id: `${rootId}-opt-${i}`, text })),
              selectedOptionId: null,
              frozenOptionIds: [],
              children: {},
              x: 80,
              y: 220
            }
          }
        };

        const { data, error } = await supabase
          .from('blueprints')
          .insert({ user_id: user.id, title: 'Untitled blueprint', graph_data })
          .select()
          .single();

        if (error) throw error;
        window.location.href = `canvas.html?id=${data.id}`;
      } catch (err) {
        const box = document.getElementById('errorBox');
        box.textContent = err.message || 'Could not create a new blueprint right now.';
        box.style.display = 'block';
        btn.disabled = false;
        btn.textContent = '+ New blueprint';
      }
    });

    loadBlueprints();
  }
</script>

</body>
</html>
